# coturn production template for the PixelWizard router.
#
# coturn does not expand environment variables in this file, so everything that differs per
# deployment is passed on the command line (docker-compose.https.yml does this from .env):
#   --static-auth-secret   the shared secret, same value as the router's TURN_SECRET
#   --realm                any stable name, e.g. turn.example.org
#   --listening-ip         the server's own address (see below)
#   --relay-ip             the server's own address (see below)
#   --external-ip          the address clients reach the server on (see below)
# Command-line options take precedence over this file. Everything else is fixed here.
#
# What the three addresses must hold:
#
#   VPS with the public IP on its NIC (single NIC):
#     listening-ip = relay-ip = the public IP (203.0.113.10)
#     external-ip  = the same public IP, no mapping
#
#   VPS where the public IP is NAT-ed to a private NIC address (some clouds):
#     listening-ip = relay-ip = the private NIC address (10.0.0.5)
#     external-ip  = 203.0.113.10/10.0.0.5   (PUBLIC/PRIVATE mapping form)
#
#   Home server behind a NAT router with port forwards:
#     listening-ip = relay-ip = the server's LAN address (192.168.1.20)
#     external-ip  = 203.0.113.10/192.168.1.20   (the router's public IP / the LAN address)
#
# Never use 127.0.0.1 or 0.0.0.0 for relay-ip in production: the spike only worked on loopback
# because both peers ran on one machine and allow-loopback-peers was set. Here loopback is
# denied (below), so a relay bound to loopback could reach nothing.

listening-port=3478

# Relay ports. Forward or open exactly this UDP range; keep it in step with docker-compose.
min-port=49160
max-port=49200

# TURN REST API credentials (use-auth-secret implies long-term auth): the router issues
# username "<expiry-unix>:<id>" and credential base64(HMAC-SHA1(secret, username)).
# coturn checks the expiry itself. static-auth-secret comes from the command line.
use-auth-secret

fingerprint
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600

# TLS (turns:) is optional and off by default, so the template runs without certificates.
# To enable it, delete the two no-* lines below, mount your certificate and key, and
# uncomment the block. Clients then use turns:turn.example.org:5349?transport=tcp
# (or forward 443 to 5349 to get past networks that only allow 443).
no-tls
no-dtls
#tls-listening-port=5349
#cert=/etc/coturn/tls/fullchain.pem
#pkey=/etc/coturn/tls/privkey.pem
#no-tlsv1
#no-tlsv1_1

# Allocation limits: per-user allocations, total allocations, bytes per second per session
# (6 MB/s is roughly 48 Mbit/s, enough for one screen-share stream).
user-quota=12
total-quota=1200
max-bps=6000000

# The relay must not be usable to reach the server's own network. Ranges, not CIDR, because
# that is the form every coturn version accepts. There is deliberately no allowed-peer-ip.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logs go to stdout (docker logs). `verbose` is what makes coturn log one line per allocation,
# "session ...: user <expiry:id>: incoming packet ALLOCATE processed, success", which is how you
# confirm a TURN allocation (the P3.8 gate reads it). It logs the username, which holds the
# expiry and a random id; the secret and credentials are never logged.
log-file=stdout
simple-log
verbose
