services:
  router-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixelwizard-router:local
    container_name: pixelwizard-router
    restart: unless-stopped
    ports:
      - "9000:9000"
    # This compose file exposes the router directly (no reverse proxy), so
    # TRUSTED_PROXY_CIDRS is deliberately left unset — the default (empty)
    # is correct here. Do not set it unless you put something in front of
    # this container. See docker-compose.https.yml for the reverse-proxy setup.
