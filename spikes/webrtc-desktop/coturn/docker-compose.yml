services:
  coturn:
    image: coturn/coturn:4.6.2
    # Docker Desktop on macOS runs containers inside a Linux VM, so
    # network_mode: host does NOT expose ports on the real Mac interface
    # the way it would on native Linux. Explicit publishing is required
    # here, including the full relay port range TURN needs.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
