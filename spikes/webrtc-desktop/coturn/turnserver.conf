listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
# Docker Desktop on macOS runs the container in a Linux VM behind NAT, so
# the container's own interface address is not reachable from the Mac host.
# external-ip tells clients (both running on the Mac host in this spike) to
# send relayed media to 127.0.0.1, which Docker Desktop's published-port
# forwarding then routes into the container. This only works because both
# peers and the TURN server are on the same machine for this spike — a real
# deployment needs a real public IP here instead.
external-ip=127.0.0.1
listening-ip=127.0.0.1
relay-ip=127.0.0.1
allow-loopback-peers
fingerprint
lt-cred-mech
user=spike:spikepass
realm=spike.local
no-cli
no-tls
no-dtls
verbose
log-file=stdout
