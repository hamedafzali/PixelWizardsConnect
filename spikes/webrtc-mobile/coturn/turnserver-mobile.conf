listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
# T9 needs a second physical device (the iPhone) to reach this TURN server,
# so unlike T8's loopback-only config, relay/external-ip must be the Mac's
# real LAN-reachable address on the iPhone-USB-personal-hotspot interface
# (checked via `ipconfig getifaddr en0`), not 127.0.0.1. listening-ip is
# 0.0.0.0 so the same instance still accepts the .NET peer's local
# connection on 127.0.0.1 as well as the phone's connection over the LAN.
# This runs natively via Homebrew (not Docker), so no NAT/port-forwarding
# translation applies -- these addresses map straight to the Mac's own
# interfaces.
listening-ip=0.0.0.0
relay-ip=172.20.10.2
external-ip=172.20.10.2
allow-loopback-peers
fingerprint
lt-cred-mech
user=spike:spikepass
realm=spike.local
no-cli
no-tls
no-dtls
verbose
log-file=stdout
