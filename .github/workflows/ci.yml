name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.304"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # actions: read lets the FFmpeg step download the vendored build from its ffmpeg.yml run.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Go builds the router that the router-backed tests (Avalonia client relay tests, WebRTC transport
      # tests) pair through.
      # Newer than the go job's 1.22.12 (which proves the go.mod minimum): Go 1.22 Mach-O binaries
      # have no LC_UUID load command, and the macOS 26 runner's dyld refuses to start them.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: false

      - name: Restore
        run: dotnet restore PixelWizardsConnect.sln

      - name: Build
        run: dotnet build PixelWizardsConnect.sln --no-restore -c Release

      # Cross-platform suite (Skia detector, protocol/golden tests, etc). Runs
      # identically on both runners.
      - name: Test (net9.0)
        run: >
          dotnet test tests/PixelWizard.Tests/PixelWizard.Tests.csproj
          --no-build -c Release -f net9.0
          --logger "console;verbosity=normal"

      # Avalonia client view models, on Avalonia's headless platform. One TFM per OS
      # like the client itself (net9.0-windows on Windows, net9.0 on macOS), so no -f.
      - name: Build the router for router-backed tests
        shell: bash
        run: cd router-server && go build -o "$RUNNER_TEMP/router.exe" .

      - name: Test (Avalonia client)
        env:
          PIXELWIZARD_ROUTER_EXE: ${{ runner.temp }}/router.exe
        run: >
          dotnet test tests/PixelWizard.AvaloniaClient.Tests/PixelWizard.AvaloniaClient.Tests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=avalonia.trx"
          --results-directory TestResults

      # The relay connector tests skip themselves without PIXELWIZARD_ROUTER_EXE; a skip here means the
      # variable was lost, so any skipped test fails the job.
      - name: Assert Avalonia client tests ran with none skipped
        shell: pwsh
        run: |
          [xml]$trx = Get-Content TestResults/avalonia.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
          Write-Host "Avalonia client tests: executed=$($results.Count) skipped=$($skipped.Count)"
          if ($skipped.Count -gt 0) {
            Write-Error "Avalonia client tests must not skip: $(($skipped | ForEach-Object { $_.testName }) -join '; ')"
            exit 1
          }

      # The System.Drawing (WinForms) detector suite only builds/executes on
      # the net9.0-windows TFM. Before T8, PixelWizard.WindowsHost's
      # UseWindowsForms=true pulled in Microsoft.WindowsDesktop.App, which has no
      # macOS build -- so the net9.0-windows test host could not even launch there.
      # T8 removed UseWindowsForms (EnumDisplayMonitors/SetCursorPos via P/Invoke
      # replace Screen/Cursor), so the host now launches on both platforms; this
      # step runs on both, and the two assertion steps below verify the platform-
      # appropriate outcome (actually-passed on Windows, gracefully-skipped on
      # macOS) via TRX, not by eyeballing green.
      - name: Test (net9.0-windows — System.Drawing suite)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: >
          dotnet test tests/PixelWizard.Tests/PixelWizard.Tests.csproj
          --no-build -c Release -f net9.0-windows
          --filter "FullyQualifiedName~ScreenChangeDetector.SystemDrawingScreenChangeDetectorTests"
          --logger "trx;LogFileName=systemdrawing.trx"
          --results-directory TestResults

      # P4.7: the raw GDI capture tests live in the net9.0-windows build only, so no other step runs them.
      # They skip (not fail) when the runner has no interactive desktop for CopyFromScreen; a missing
      # result or a failure fails the job.
      - name: Test (net9.0-windows — raw capture)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet test tests/PixelWizard.Tests/PixelWizard.Tests.csproj --no-build -c Release -f net9.0-windows `
            --filter "FullyQualifiedName~WindowsRawCaptureTests" `
            --logger "console;verbosity=normal" --logger "trx;LogFileName=rawcapture.trx" --results-directory TestResults
          [xml]$trx = Get-Content TestResults/rawcapture.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' })
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
          $failed = @($results | Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'NotExecuted' })
          Write-Host "Windows raw capture: executed=$($results.Count) passed=$($passed.Count) skipped=$($skipped.Count) failed=$($failed.Count)"
          if ($results.Count -ne 2 -or $failed.Count -gt 0) { Write-Error "Expected 2 WindowsRawCaptureTests results with no failures."; exit 1 }
          if ($skipped.Count -gt 0) { Write-Host "::notice::Windows raw capture skipped on this runner: $(($skipped | ForEach-Object { $_.Output.StdOut + $_.Output.ErrorInfo.Message }) -join ' | ')" }

      - name: Assert System.Drawing suite actually executed and passed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 13 = number of [SkippableFact] cases in SystemDrawingScreenChangeDetectorTests.cs.
          # Update this count deliberately if cases are added/removed — it exists
          # specifically to catch the suite silently reporting 0 executed as green.
          $expected = 13

          [xml]$trx = Get-Content TestResults/systemdrawing.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $executed = $results.Count
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' })
          $notPassed = @($results | Where-Object { $_.outcome -ne 'Passed' })

          Write-Host "System.Drawing suite: executed=$executed passed=$($passed.Count) other=$($notPassed.Count)"

          if ($executed -ne $expected) {
            Write-Error "Expected exactly $expected SystemDrawing tests to execute on windows-latest, got $executed. A suite that skips on every platform must not report green."
            exit 1
          }
          if ($notPassed.Count -gt 0) {
            $names = ($notPassed | ForEach-Object { "$($_.testName): $($_.outcome)" }) -join "; "
            Write-Error "SystemDrawing suite executed but did not all pass: $names"
            exit 1
          }
          Write-Host "::notice::SystemDrawingScreenChangeDetectorTests: $expected/$expected executed and passed on windows-latest."

      # T8 change: before T8 this asserted the net9.0-windows test host loudly
      # FAILED TO LAUNCH on macOS (Microsoft.WindowsDesktop.App absence) -- that
      # code path no longer exists. The host now launches and every case is
      # skipped gracefully in-process by SkipIfNotWindows()
      # (SystemDrawingScreenChangeDetectorTests.cs), the way SkippableFact was
      # always meant to work. Assert that graceful skip explicitly, the same way
      # the Windows step asserts an actual pass -- a suite that silently executes
      # 0 cases as a false green must not go unnoticed here either.
      - name: Assert System.Drawing suite gracefully skipped (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $expected = 13

          [xml]$trx = Get-Content TestResults/systemdrawing.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $executed = $results.Count
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
          $notSkipped = @($results | Where-Object { $_.outcome -ne 'NotExecuted' })

          Write-Host "System.Drawing suite on macOS: executed=$executed skipped=$($skipped.Count) other=$($notSkipped.Count)"

          if ($executed -ne $expected) {
            Write-Error "Expected exactly $expected SystemDrawing tests to report on macos-latest, got $executed."
            exit 1
          }
          if ($notSkipped.Count -gt 0) {
            $names = ($notSkipped | ForEach-Object { "$($_.testName): $($_.outcome)" }) -join "; "
            Write-Error "SystemDrawing suite reported unexpected outcomes on macos-latest (expected all skipped via SkipIfNotWindows): $names"
            exit 1
          }
          Write-Host "::notice::SystemDrawingScreenChangeDetectorTests: $expected/$expected gracefully skipped on macos-latest (SkipIfNotWindows in-process skip, not a test-host launch failure)."

      # P4.6: the vendored LGPL FFmpeg from an ffmpeg.yml run (workflow artifacts, retained until
      # 2027-02-19), checked against pinned SHA-256s. Interim until the build is published as a
      # release and packaging/ffmpeg/manifest.json carries the hashes (P4.9).
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          path: ${{ runner.temp }}/ffmpeg-dl
          run-id: 44884098400
          github-token: ${{ github.token }}

      - name: Verify and unpack the vendored FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            zip=ffmpeg-9.0.1-pw1-windows-x64.zip; sha=912ae1a9a1dd73277991a81ec80fc805919ded7284f37afa3dbd7c41c04b87a9
          else
            zip=ffmpeg-9.0.1-pw1-macos-arm64.zip; sha=63b146aaa420d75accc6219ed6f80fd6da05744520bd1cdf37a667c34913463d
          fi
          cd "$RUNNER_TEMP/ffmpeg-dl"
          # Git Bash on Windows has sha256sum but no shasum; macOS has both on current runners.
          if command -v sha256sum >/dev/null; then echo "$sha  $zip" | sha256sum -c -; else echo "$sha  $zip" | shasum -a 256 -c -; fi
          mkdir -p "$RUNNER_TEMP/ffmpeg" && unzip -q -o "$zip" -d "$RUNNER_TEMP/ffmpeg"
          lib=$(dirname "$(find "$RUNNER_TEMP/ffmpeg" \( -name 'avcodec-*.dll' -o -name 'libavcodec*.dylib' \) | head -n 1)")
          [ -n "$lib" ] || { echo "::error::no avcodec library in $zip"; exit 1; }
          echo "PIXELWIZARD_FFMPEG_DIR=$lib" >> "$GITHUB_ENV"

      - name: Test (FFmpeg probe)
        run: >
          dotnet test tests/PixelWizard.FFmpeg.Tests/PixelWizard.FFmpeg.Tests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=ffmpeg.trx"
          --results-directory TestResults

      - name: Assert FFmpeg tests all executed and passed
        shell: pwsh
        run: |
          # 8 = FfmpegProbeTests (3) and H264CodecTests (5) cases. Update deliberately when FFmpeg-backed tests are added: the suite
          # skips itself when PIXELWIZARD_FFMPEG_DIR is missing, so a skip must fail here.
          $expected = 8
          [xml]$trx = Get-Content TestResults/ffmpeg.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' })
          Write-Host "FFmpeg tests: executed=$($results.Count) passed=$($passed.Count)"
          if ($results.Count -ne $expected -or $passed.Count -ne $expected) {
            $bad = @($results | Where-Object { $_.outcome -ne 'Passed' }) | ForEach-Object { "$($_.testName): $($_.outcome)" }
            Write-Error "Expected $expected FFmpeg tests to pass, none skipped: $($bad -join '; ')"
            exit 1
          }

      # P4.2: two WebRtcTransports are paired in one process through a real router built on this runner
      # (no TURN, so candidates are host candidates; relay is covered by the coturn job). The fixture starts
      # the router from PIXELWIZARD_ROUTER_EXE (built in the step before the Avalonia client tests). Runs on both OSes so neither OS's SIPSorcery behaviour
      # stands alone (PHASE4-PLAN risks). This replaces the P3.7 ICE-probe step; the probe project stays
      # as a diagnostic tool. The assertion step below fails on any skip, because the suite skips itself
      # whenever the variable is missing.
      - name: WebRTC transport tests (real router)
        shell: bash
        timeout-minutes: 10
        run: |
          # GitHub runs bash steps with -eo pipefail; the test status is checked explicitly instead.
          set +e -u
          PIXELWIZARD_ROUTER_EXE="$RUNNER_TEMP/router.exe" dotnet test tests/PixelWizard.Transport.WebRtc.Tests/PixelWizard.Transport.WebRtc.Tests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=webrtc.trx" \
            --results-directory TestResults
          RC=$?
          [ "$RC" -eq 0 ] || { echo "::error::WebRTC transport tests failed on ${{ runner.os }} (exit $RC)"; exit 1; }

      - name: Assert WebRTC transport tests all executed and passed
        shell: pwsh
        run: |
          # 24 = number of [RouterFact] and [RouterAndFfmpegFact] cases in the WebRTC test project (the latter also need PIXELWIZARD_FFMPEG_DIR, exported to $GITHUB_ENV by the FFmpeg verify step above). Update deliberately when cases are
          # added or removed: it exists to catch the suite reporting skipped (router variable lost) or
          # fewer tests than written as green.
          $expected = 24

          [xml]$trx = Get-Content TestResults/webrtc.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $executed = $results.Count
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' })
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })

          Write-Host "WebRTC transport tests: executed=$executed passed=$($passed.Count) skipped=$($skipped.Count)"

          if ($executed -ne $expected) {
            Write-Error "Expected exactly $expected WebRTC transport tests to execute, got $executed."
            exit 1
          }
          if ($skipped.Count -gt 0 -or $passed.Count -ne $expected) {
            $bad = @($results | Where-Object { $_.outcome -ne 'Passed' }) | ForEach-Object { "$($_.testName): $($_.outcome)" }
            Write-Error "WebRTC transport tests must all pass with none skipped: $($bad -join '; ')"
            exit 1
          }
          Write-Host "::notice::WebRTC transport tests: $expected/$expected passed on ${{ runner.os }} (paired through the real router)."

  # T7's only automated coverage for WebSocketHostServer (extracted from
  # PixelWizard.Transport.Tcp into PixelWizard.Transport.WebSocket): headless
  # Chromium loads the embedded browser viewer against a real server instance
  # and confirms it renders a broadcast frame end to end (WS connect -> 0x01
  # frame tag -> JS decode -> canvas visible). Node drives Playwright; the
  # server itself runs as a small standalone .NET host process spawned by the
  # driver script (xUnit cannot drive a browser page). See
  # tests/WebViewerSmoke/drive.mjs and Host/Program.cs for what this test does
  # and, importantly, does not cover (no real screen capture pipeline).
  playwright-smoke:
    runs-on: ubuntu-latest
    # This job hung for 4+ hours on its first run (33802825128) due to a driver bug
    # that left Chromium running after a failure instead of exiting -- fixed, but
    # capping the job here means any future hang fails in minutes, not hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/WebViewerSmoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: node drive.mjs

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('router-server/go.mod', 'router-server/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        shell: bash
        run: |
          # GitHub runs bash steps with -e; turn it off so a failing go test still reaches the
          # summary and the FAIL lines below. Every exit status is checked explicitly.
          set +e -uo pipefail
          # Same packages and flags as a plain `go test -race ./...`; -json only adds a
          # machine-readable stream so the counts can be reported.
          go test -race -json ./... > "$RUNNER_TEMP/gotest.json"
          rc=$?
          # Top-level tests only (names without a '/'); subtests are counted separately.
          count() { jq -r --arg a "$1" 'select(.Action==$a and .Test!=null and (.Test|contains("/")|not)) | .Test' "$RUNNER_TEMP/gotest.json" | wc -l | tr -d ' '; }
          passed=$(count pass); failed=$(count fail); skipped=$(count skip)
          executed=$((passed + failed + skipped))
          subtests=$(jq -r 'select((.Action=="pass" or .Action=="fail" or .Action=="skip") and .Test!=null and (.Test|contains("/"))) | .Test' "$RUNNER_TEMP/gotest.json" | wc -l | tr -d ' ')
          line="Go tests: executed=$executed passed=$passed failed=$failed skipped=$skipped (subtests=$subtests, counted separately)"
          echo "$line"
          echo "::notice title=Go router tests::$line"
          if [ "$rc" -ne 0 ]; then
            # Show the failing output in the log, then fail.
            jq -r 'select(.Action=="output") | .Output' "$RUNNER_TEMP/gotest.json" | grep -E '^(--- FAIL|FAIL|panic|WARNING: DATA RACE)' || true
            echo "::error::go test exited with status $rc"
            exit "$rc"
          fi
          if [ "$failed" -ne 0 ]; then echo "::error::$failed Go test(s) failed"; exit 1; fi
          if [ "$executed" -eq 0 ]; then echo "::error::No Go tests executed"; exit 1; fi

  # P3.5: proves a real coturn, running router-server/coturn/turnserver.conf, accepts credentials
  # issued by the router's own Go code (issueTurnCredentials) and refuses what it should. The
  # test is router-server/coturn_integration_test.go (build tag `coturn`, so it is not in the
  # normal `go test`); it drives turnutils_uclient inside the coturn container and prints a
  # PASS (a)/(b)/(c) line for each check.
  coturn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: router-server
    env:
      # Test-only secret; this job's coturn is not reachable from outside the runner.
      TURN_TEST_SECRET: ci-test-secret-not-used-anywhere-else
      TURN_TEST_CONTAINER: coturn-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: false

      # Host networking and the runner's own address, not loopback: the template denies
      # 127.0.0.0/8 as a peer range, and uclient's peer must be a legal relay target. The
      # runner address is itself in a denied private range, so it alone is allowed through
      # --allowed-peer-ip; 10.255.255.254 (check c) stays denied by the template.
      - name: Start coturn from the template
        run: |
          HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1); exit}')
          echo "runner address: $HOST_IP"
          echo "TURN_TEST_HOST=$HOST_IP" >> "$GITHUB_ENV"
          docker run -d --name "$TURN_TEST_CONTAINER" --network host \
            -v "$PWD/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro" \
            coturn/coturn:4.6.2 -c /etc/coturn/turnserver.conf \
            --static-auth-secret="$TURN_TEST_SECRET" --realm=turn.example.org \
            --listening-ip="$HOST_IP" --relay-ip="$HOST_IP" --external-ip="$HOST_IP" \
            --allowed-peer-ip="$HOST_IP"
          for i in $(seq 1 20); do
            docker logs "$TURN_TEST_CONTAINER" 2>&1 | grep -q "UDP listener opened on: $HOST_IP:3478" && break
            sleep 1
          done
          docker logs "$TURN_TEST_CONTAINER" 2>&1 | grep -q "UDP listener opened on: $HOST_IP:3478" \
            || { docker logs "$TURN_TEST_CONTAINER"; echo "coturn did not start"; exit 1; }
          # UDP echo peer that uclient relays to.
          docker exec -d "$TURN_TEST_CONTAINER" turnutils_peer -L "$HOST_IP" -p 3480

      - name: Vet (coturn tag)
        run: go vet -tags coturn ./...

      - name: coturn accepts router credentials (a), refuses expired (b) and denied peers (c)
        run: go test -tags coturn -run TestCoturn -count=1 -v ./...

      - name: coturn log
        if: always()
        run: docker logs "$TURN_TEST_CONTAINER" 2>&1 | grep -v "turn server id" | tail -80
