name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.304"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PixelWizardsConnect.sln

      - name: Build
        run: dotnet build PixelWizardsConnect.sln --no-restore -c Release

      # Cross-platform suite (Skia detector, protocol/golden tests, etc). Runs
      # identically on both runners.
      - name: Test (net9.0)
        run: >
          dotnet test tests/PixelWizard.Tests/PixelWizard.Tests.csproj
          --no-build -c Release -f net9.0
          --logger "console;verbosity=normal"

      # The System.Drawing (WinForms) detector suite only builds/executes on
      # the net9.0-windows TFM. Before T8, PixelWizard.WindowsHost's
      # UseWindowsForms=true pulled in Microsoft.WindowsDesktop.App, which has no
      # macOS build -- so the net9.0-windows test host could not even launch there.
      # T8 removed UseWindowsForms (EnumDisplayMonitors/SetCursorPos via P/Invoke
      # replace Screen/Cursor), so the host now launches on both platforms; this
      # step runs on both, and the two assertion steps below verify the platform-
      # appropriate outcome (actually-passed on Windows, gracefully-skipped on
      # macOS) via TRX, not by eyeballing green.
      - name: Test (net9.0-windows — System.Drawing suite)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: >
          dotnet test tests/PixelWizard.Tests/PixelWizard.Tests.csproj
          --no-build -c Release -f net9.0-windows
          --filter "FullyQualifiedName~ScreenChangeDetector.SystemDrawingScreenChangeDetectorTests"
          --logger "trx;LogFileName=systemdrawing.trx"
          --results-directory TestResults

      - name: Assert System.Drawing suite actually executed and passed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 13 = number of [SkippableFact] cases in SystemDrawingScreenChangeDetectorTests.cs.
          # Update this count deliberately if cases are added/removed — it exists
          # specifically to catch the suite silently reporting 0 executed as green.
          $expected = 13

          [xml]$trx = Get-Content TestResults/systemdrawing.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $executed = $results.Count
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' })
          $notPassed = @($results | Where-Object { $_.outcome -ne 'Passed' })

          Write-Host "System.Drawing suite: executed=$executed passed=$($passed.Count) other=$($notPassed.Count)"

          if ($executed -ne $expected) {
            Write-Error "Expected exactly $expected SystemDrawing tests to execute on windows-latest, got $executed. A suite that skips on every platform must not report green."
            exit 1
          }
          if ($notPassed.Count -gt 0) {
            $names = ($notPassed | ForEach-Object { "$($_.testName): $($_.outcome)" }) -join "; "
            Write-Error "SystemDrawing suite executed but did not all pass: $names"
            exit 1
          }
          Write-Host "::notice::SystemDrawingScreenChangeDetectorTests: $expected/$expected executed and passed on windows-latest."

      # T8 change: before T8 this asserted the net9.0-windows test host loudly
      # FAILED TO LAUNCH on macOS (Microsoft.WindowsDesktop.App absence) -- that
      # code path no longer exists. The host now launches and every case is
      # skipped gracefully in-process by SkipIfNotWindows()
      # (SystemDrawingScreenChangeDetectorTests.cs), the way SkippableFact was
      # always meant to work. Assert that graceful skip explicitly, the same way
      # the Windows step asserts an actual pass -- a suite that silently executes
      # 0 cases as a false green must not go unnoticed here either.
      - name: Assert System.Drawing suite gracefully skipped (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $expected = 13

          [xml]$trx = Get-Content TestResults/systemdrawing.trx
          $results = @($trx.TestRun.Results.UnitTestResult)
          $executed = $results.Count
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
          $notSkipped = @($results | Where-Object { $_.outcome -ne 'NotExecuted' })

          Write-Host "System.Drawing suite on macOS: executed=$executed skipped=$($skipped.Count) other=$($notSkipped.Count)"

          if ($executed -ne $expected) {
            Write-Error "Expected exactly $expected SystemDrawing tests to report on macos-latest, got $executed."
            exit 1
          }
          if ($notSkipped.Count -gt 0) {
            $names = ($notSkipped | ForEach-Object { "$($_.testName): $($_.outcome)" }) -join "; "
            Write-Error "SystemDrawing suite reported unexpected outcomes on macos-latest (expected all skipped via SkipIfNotWindows): $names"
            exit 1
          }
          Write-Host "::notice::SystemDrawingScreenChangeDetectorTests: $expected/$expected gracefully skipped on macos-latest (SkipIfNotWindows in-process skip, not a test-host launch failure)."

  # T7's only automated coverage for WebSocketHostServer (extracted from
  # PixelWizard.Transport.Tcp into PixelWizard.Transport.WebSocket): headless
  # Chromium loads the embedded browser viewer against a real server instance
  # and confirms it renders a broadcast frame end to end (WS connect -> 0x01
  # frame tag -> JS decode -> canvas visible). Node drives Playwright; the
  # server itself runs as a small standalone .NET host process spawned by the
  # driver script (xUnit cannot drive a browser page). See
  # tests/WebViewerSmoke/drive.mjs and Host/Program.cs for what this test does
  # and, importantly, does not cover (no real screen capture pipeline).
  playwright-smoke:
    runs-on: ubuntu-latest
    # This job hung for 4+ hours on its first run (33802825128) due to a driver bug
    # that left Chromium running after a failure instead of exiting -- fixed, but
    # capping the job here means any future hang fails in minutes, not hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/WebViewerSmoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: node drive.mjs

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('router-server/go.mod', 'router-server/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...
